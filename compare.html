<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare - GitHub Voyager</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 300: '#7dd3fc',
                            400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1',
                            800: '#075985', 900: '#0c4a6e', 950: '#082f49',
                        },
                        secondary: {
                            50: '#fdf4ff', 100: '#fae8ff', 200: '#f5d0fe', 300: '#f0abfc',
                            400: '#e879f9', 500: '#d946ef', 600: '#c026d3', 700: '#a21caf',
                            800: '#86198f', 900: '#701a75', 950: '#4a044e',
                        }
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'shimmer': 'shimmer 2s linear infinite',
                    },
                    keyframes: {
                        float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-20px)' } },
                        shimmer: { '0%': { backgroundPosition: '-200% 0' }, '100%': { backgroundPosition: '200% 0' } }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen transition-colors duration-300">
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute top-0 left-1/4 w-96 h-96 bg-primary-500/10 rounded-full blur-3xl animate-pulse-slow"></div>
        <div class="absolute bottom-0 right-1/4 w-96 h-96 bg-secondary-500/10 rounded-full blur-3xl animate-pulse-slow" style="animation-delay: 2s;"></div>
    </div>

    <github-nav></github-nav>

    <main class="relative z-10 pt-24 pb-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-7xl mx-auto">
            <div class="text-center mb-12">
                <h1 class="text-4xl sm:text-5xl font-bold mb-4 bg-gradient-to-r from-primary-400 via-secondary-400 to-primary-400 bg-clip-text text-transparent">
                    Developer Showdown
                </h1>
                <p class="text-xl text-gray-400">Compare GitHub profiles side by side</p>
            </div>

            <!-- Search Inputs -->
            <div class="grid md:grid-cols-2 gap-6 mb-12">
                <div class="relative group">
                    <div class="absolute -inset-1 bg-gradient-to-r from-primary-500 to-primary-600 rounded-2xl blur opacity-25 group-hover:opacity-50 transition duration-500"></div>
                    <div class="relative flex items-center bg-gray-900 rounded-2xl border border-gray-800 p-2">
                        <i data-feather="user" class="w-6 h-6 text-gray-500 ml-4"></i>
                        <input type="text" id="user1Input" placeholder="First username..." class="flex-1 bg-transparent border-none outline-none text-white placeholder-gray-500 px-4 py-3 text-lg">
                    </div>
                </div>
                <div class="relative group">
                    <div class="absolute -inset-1 bg-gradient-to-r from-secondary-500 to-secondary-600 rounded-2xl blur opacity-25 group-hover:opacity-50 transition duration-500"></div>
                    <div class="relative flex items-center bg-gray-900 rounded-2xl border border-gray-800 p-2">
                        <i data-feather="user" class="w-6 h-6 text-gray-500 ml-4"></i>
                        <input type="text" id="user2Input" placeholder="Second username..." class="flex-1 bg-transparent border-none outline-none text-white placeholder-gray-500 px-4 py-3 text-lg">
                    </div>
                </div>
            </div>

            <button id="compareBtn" class="w-full max-w-md mx-auto block px-8 py-4 bg-gradient-to-r from-primary-600 to-secondary-600 hover:from-primary-500 hover:to-secondary-500 text-white font-semibold rounded-2xl transition-all duration-300 transform hover:scale-105 flex items-center justify-center gap-3 mb-12">
                <i data-feather="git-compare" class="w-6 h-6"></i>
                <span>Compare Profiles</span>
            </button>

            <!-- Loading State -->
            <div id="compareLoading" class="hidden text-center py-12">
                <div class="relative w-24 h-24 mx-auto mb-6">
                    <div class="absolute inset-0 border-4 border-primary-500/20 rounded-full"></div>
                    <div class="absolute inset-0 border-4 border-t-primary-500 border-r-transparent border-b-transparent border-l-transparent rounded-full animate-spin"></div>
                </div>
                <p class="text-xl text-gray-400 animate-pulse">Loading profiles...</p>
            </div>

            <!-- Comparison Results -->
            <div id="compareResults" class="hidden">
                <!-- VS Header -->
                <div class="flex items-center justify-center gap-8 mb-12">
                    <div class="text-center">
                        <img id="avatar1" src="" alt="" class="w-24 h-24 rounded-2xl mx-auto mb-3 border-2 border-primary-500">
                        <h3 id="name1" class="text-xl font-bold"></h3>
                    </div>
                    <div class="text-4xl font-black text-gray-600 italic">VS</div>
                    <div class="text-center">
                        <img id="avatar2" src="" alt="" class="w-24 h-24 rounded-2xl mx-auto mb-3 border-2 border-secondary-500">
                        <h3 id="name2" class="text-xl font-bold"></h3>
                    </div>
                </div>

                <!-- Stats Comparison -->
                <div class="grid md:grid-cols-2 gap-6 mb-12">
                    <!-- Column 1 -->
                    <div class="space-y-4" id="user1Stats"></div>
                    <!-- Column 2 -->
                    <div class="space-y-4" id="user2Stats"></div>
                </div>

                <!-- Winner Banner -->
                <div id="winnerBanner" class="text-center py-8 rounded-3xl bg-gradient-to-r from-amber-500/20 to-orange-500/20 border border-amber-500/30 hidden">
                    <i data-feather="trophy" class="w-12 h-12 text-amber-400 mx-auto mb-3"></i>
                    <h3 id="winnerText" class="text-2xl font-bold text-amber-400"></h3>
                </div>
            </div>

            <!-- Error State -->
            <div id="compareError" class="hidden text-center py-12">
                <div class="w-20 h-20 mx-auto mb-4 rounded-full bg-red-500/10 flex items-center justify-center">
                    <i data-feather="alert-circle" class="w-10 h-10 text-red-400"></i>
                </div>
                <p id="compareErrorMsg" class="text-gray-400"></p>
            </div>
        </div>
    </main>

    <github-footer></github-footer>

    <script src="components/nav.js"></script>
    <script src="components/footer.js"></script>
    <script src="compare.js"></script>
    <script>feather.replace();</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stats - GitHub Voyager</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 300: '#7dd3fc',
                            400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1',
                            800: '#075985', 900: '#0c4a6e', 950: '#082f49',
                        },
                        secondary: {
                            50: '#fdf4ff', 100: '#fae8ff', 200: '#f5d0fe', 300: '#f0abfc',
                            400: '#e879f9', 500: '#d946ef', 600: '#c026d3', 700: '#a21caf',
                            800: '#86198f', 900: '#701a75', 950: '#4a044e',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen transition-colors duration-300">
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute top-0 left-1/4 w-96 h-96 bg-primary-500/10 rounded-full blur-3xl animate-pulse-slow"></div>
        <div class="absolute bottom-0 right-1/4 w-96 h-96 bg-secondary-500/10 rounded-full blur-3xl animate-pulse-slow" style="animation-delay: 2s;"></div>
    </div>

    <github-nav></github-nav>

    <main class="relative z-10 pt-24 pb-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-7xl mx-auto">
            <div class="text-center mb-12">
                <h1 class="text-4xl sm:text-5xl font-bold mb-4 bg-gradient-to-r from-primary-400 via-secondary-400 to-primary-400 bg-clip-text text-transparent">
                    GitHub Analytics
                </h1>
                <p class="text-xl text-gray-400">Deep insights into your GitHub activity</p>
            </div>

            <!-- Search -->
            <div class="max-w-xl mx-auto mb-12">
                <div class="relative flex items-center bg-gray-900 rounded-2xl border border-gray-800 p-2">
                    <i data-feather="search" class="w-6 h-6 text-gray-500 ml-4"></i>
                    <input type="text" id="statsUsername" placeholder="Enter GitHub username..." class="flex-1 bg-transparent border-none outline-none text-white placeholder-gray-500 px-4 py-3 text-lg">
                    <button id="analyzeBtn" class="px-6 py-3 bg-gradient-to-r from-primary-600 to-secondary-600 hover:from-primary-500 hover:to-secondary-500 text-white font-semibold rounded-xl transition-all">
                        Analyze
                    </button>
                </div>
            </div>

            <!-- Loading -->
            <div id="statsLoading" class="hidden text-center py-12">
                <div class="relative w-24 h-24 mx-auto mb-6">
                    <div class="absolute inset-0 border-4 border-primary-500/20 rounded-full"></div>
                    <div class="absolute inset-0 border-4 border-t-primary-500 rounded-full animate-spin"></div>
                </div>
                <p class="text-gray-400 animate-pulse">Crunching numbers...</p>
            </div>

            <!-- Results -->
            <div id="statsResults" class="hidden space-y-8">
                <!-- Overview Cards -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div class="p-6 rounded-2xl bg-gray-900 border border-gray-800 text-center">
                        <i data-feather="git-commit" class="w-8 h-8 text-primary-400 mx-auto mb-2"></i>
                        <div id="totalCommits" class="text-3xl font-bold">-</div>
                        <div class="text-sm text-gray-500">Est. Commits</div>
                    </div>
                    <div class="p-6 rounded-2xl bg-gray-900 border border-gray-800 text-center">
                        <i data-feather="code" class="w-8 h-8 text-secondary-400 mx-auto mb-2"></i>
                        <div id="totalCode" class="text-3xl font-bold">-</div>
                        <div class="text-sm text-gray-500">Lines of Code</div>
                    </div>
                    <div class="p-6 rounded-2xl bg-gray-900 border border-gray-800 text-center">
                        <i data-feather="clock" class="w-8 h-8 text-emerald-400 mx-auto mb-2"></i>
                        <div id="activeDays" class="text-3xl font-bold">-</div>
                        <div class="text-sm text-gray-500">Active Days</div>
                    </div>
                    <div class="p-6 rounded-2xl bg-gray-900 border border-gray-800 text-center">
                        <i data-feather="zap" class="w-8 h-8 text-amber-400 mx-auto mb-2"></i>
                        <div id="streak" class="text-3xl font-bold">-</div>
                        <div class="text-sm text-gray-500">Best Streak</div>
                    </div>
                </div>

                <!-- Charts Grid -->
                <div class="grid lg:grid-cols-2 gap-6">
                    <!-- Language Chart -->
                    <div class="p-6 rounded-2xl bg-gray-900 border border-gray-800">
                        <h3 class="text-lg font-semibold mb-4 flex items-center gap-2">
                            <i data-feather="pie-chart" class="w-5 h-5 text-primary-400"></i>
                            Language Distribution
                        </h3>
                        <canvas id="languagePieChart"></canvas>
                    </div>

                    <!-- Activity Chart -->
                    <div class="p-6 rounded-2xl bg-gray-900 border border-gray-800">
                        <h3 class="text-lg font-semibold mb-4 flex items-center gap-2">
                            <i data-feather="activity" class="w-5 h-5 text-secondary-400"></i>
                            Contribution Activity
                        </h3>
                        <canvas id="activityChart"></canvas>
                    </div>

                    <!-- Repo Growth -->
                    <div class="p-6 rounded-2xl bg-gray-900 border border-gray-800">
                        <h3 class="text-lg font-semibold mb-4 flex items-center gap-2">
                            <i data-feather="trending-up" class="w-5 h-5 text-emerald-400"></i>
                            Repository Growth
                        </h3>
                        <canvas id="growthChart"></canvas>
                    </div>

                    <!-- Top Repos -->
                    <div class="p-6 rounded-2xl bg-gray-900 border border-gray-800">
                        <h3 class="text-lg font-semibold mb-4 flex items-center gap-2">
                            <i data-feather="award" class="w-5 h-5 text-amber-400"></i>
                            Top Repositories
                        </h3>
                        <div id="topReposList" class="space-y-3"></div>
                    </div>
                </div>

                <!-- Commit Heatmap -->
                <div class="p-6 rounded-2xl bg-gray-900 border border-gray-800">
                    <h3 class="text-lg font-semibold mb-4 flex items-center gap-2">
                        <i data-feather="calendar" class="w-5 h-5 text-primary-400"></i>
                        Contribution Calendar
                    </h3>
                    <div id="contributionCalendar" class="flex flex-wrap gap-1"></div>
                </div>
            </div>

            <!-- Error -->
            <div id="statsError" class="hidden text-center py-12">
                <div class="w-20 h-20 mx-auto mb-4 rounded-full bg-red-500/10 flex items-center justify-center">
                    <i data-feather="alert-circle" class="w-10 h-10 text-red-400"></i>
                </div>
                <p id="statsErrorMsg" class="text-gray-400"></p>
            </div>
        </div>
    </main>

    <github-footer></github-footer>

    <script src="components/nav.js"></script>
    <script src="components/footer.js"></script>
    <script src="stats.js"></script>
    <script>feather.replace();</script>
</body>
</html>
